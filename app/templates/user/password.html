{% extends "base.html" %}
{% from "macros/ui.html" import page_header %}

{% block title %}{{ t('user.password.title') }}{% endblock %}

{% block content %}
{{ page_header(t('user.password.title'), t('user.password.subtitle')) }}

<section class="panel panel-narrow">
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="current_password">{{ t('user.password.current') }}</label>
      <input type="password" id="current_password" name="current_password" required autocomplete="current-password">
    </div>
    <div class="form-group">
      <label for="new_password">{{ t('user.password.new') }}</label>
      <input type="password" id="new_password" name="new_password" required minlength="8" autocomplete="new-password">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{{ t('user.password.submit') }}</button>
      <a href="{{ url_for('user.profile') }}" class="btn btn-ghost">{{ t('common.cancel') }}</a>
    </div>
  </form>
</section>
{% endblock %}
